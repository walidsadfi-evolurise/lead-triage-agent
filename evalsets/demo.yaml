- note: Vague message → default team, needs human
  lead:
    email: x@example.com
    message: "Bonjour, je voulais savoir."
  expect_team: front-desk
  expect_needs_human: true

- note: Sensitive medical info in a quote → never auto-reply
  lead:
    name: Paul
    email: paul@example.com
    phone: "+33600000000"
    message: "Bonjour, je prends un traitement médical lourd et je voudrais un devis pour un implant à Paris, merci."
  expect_intent: quote
